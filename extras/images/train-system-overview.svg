<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
  </defs>

  <!-- Background (readable in light and dark mode) -->
  <rect x="0" y="0" width="1200" height="600" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#1d2433">UWB train integrity &amp; composition monitoring</text>
  <text x="40" y="70" font-size="15" fill="#5a6372">One UWB device per vehicle · measurements gathered in the coordinator every cycle</text>

  <!-- Legend -->
  <g font-size="13" fill="#1d2433">
    <circle cx="862" cy="38" r="9" fill="#e8833a"/>
    <text x="878" y="43">Coordinator</text>
    <circle cx="978" cy="38" r="9" fill="#2a9d8f"/>
    <text x="994" y="43">Node</text>
    <line x1="853" y1="64" x2="883" y2="64" stroke="#1d2433" stroke-width="3"/>
    <text x="890" y="69">Link (son)</text>
    <line x1="978" y1="64" x2="1008" y2="64" stroke="#8a5cc2" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="1015" y="69">Two-hop (grandson)</text>
  </g>

  <!-- Two-hop measures (grandson) -->
  <g fill="none" stroke="#8a5cc2" stroke-width="2.5" stroke-dasharray="7 5">
    <path d="M130,186 Q355,70 580,186"/>
    <path d="M350,186 Q580,105 810,186"/>
    <path d="M580,186 Q810,70 1040,186"/>
  </g>

  <!-- Links (son) -->
  <g stroke="#1d2433" stroke-width="3">
    <line x1="152" y1="210" x2="328" y2="210"/>
    <line x1="372" y1="210" x2="558" y2="210"/>
    <line x1="602" y1="210" x2="788" y2="210"/>
    <line x1="832" y1="210" x2="1018" y2="210"/>
  </g>

  <!-- Rail -->
  <line x1="20" y1="352" x2="1180" y2="352" stroke="#8b939e" stroke-width="4"/>

  <!-- Vehicles -->
  <g stroke="#1d2433" stroke-width="2">
    <!-- Locomotive -->
    <path d="M40,330 L40,262 Q40,246 56,246 L196,246 Q220,246 220,270 L220,330 z" fill="#fbe3cf"/>
    <rect x="58" y="260" width="44" height="28" rx="4" fill="#ffffff"/>
    <!-- Wagons -->
    <rect x="250" y="250" width="200" height="80" rx="8" fill="#d6efec"/>
    <rect x="480" y="250" width="200" height="80" rx="8" fill="#d6efec"/>
    <rect x="710" y="250" width="200" height="80" rx="8" fill="#d6efec"/>
    <rect x="940" y="250" width="200" height="80" rx="8" fill="#d6efec"/>
  </g>

  <!-- Couplers -->
  <g fill="#5a6372">
    <rect x="220" y="314" width="30" height="8"/>
    <rect x="450" y="314" width="30" height="8"/>
    <rect x="680" y="314" width="30" height="8"/>
    <rect x="910" y="314" width="30" height="8"/>
  </g>

  <!-- Wheels -->
  <g fill="#1d2433">
    <circle cx="80" cy="338" r="11"/><circle cx="180" cy="338" r="11"/>
    <circle cx="290" cy="338" r="11"/><circle cx="410" cy="338" r="11"/>
    <circle cx="520" cy="338" r="11"/><circle cx="640" cy="338" r="11"/>
    <circle cx="750" cy="338" r="11"/><circle cx="870" cy="338" r="11"/>
    <circle cx="980" cy="338" r="11"/><circle cx="1100" cy="338" r="11"/>
  </g>

  <!-- Vehicle labels -->
  <g font-size="14" fill="#1d2433" text-anchor="middle">
    <text x="150" y="312">Locomotive</text>
    <text x="350" y="296">Wagon 1</text>
    <text x="580" y="296">Wagon 2</text>
    <text x="810" y="296">Wagon 3</text>
    <text x="1040" y="296">Wagon 4 (tail)</text>
  </g>

  <!-- Device masts -->
  <g stroke="#1d2433" stroke-width="2">
    <line x1="130" y1="232" x2="130" y2="246"/>
    <line x1="350" y1="232" x2="350" y2="250"/>
    <line x1="580" y1="232" x2="580" y2="250"/>
    <line x1="810" y1="232" x2="810" y2="250"/>
    <line x1="1040" y1="232" x2="1040" y2="250"/>
  </g>

  <!-- Devices -->
  <g stroke="#ffffff" stroke-width="3" font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="130" cy="210" r="22" fill="#e8833a"/>
    <circle cx="350" cy="210" r="22" fill="#2a9d8f"/>
    <circle cx="580" cy="210" r="22" fill="#2a9d8f"/>
    <circle cx="810" cy="210" r="22" fill="#2a9d8f"/>
    <circle cx="1040" cy="210" r="22" fill="#2a9d8f"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="130" y="215">C1</text>
    <text x="350" y="215">W1</text>
    <text x="580" y="215">W2</text>
    <text x="810" y="215">W3</text>
    <text x="1040" y="215">W4</text>
  </g>

  <!-- Step 1: token -->
  <line x1="130" y1="400" x2="1040" y2="400" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="140" y="390" font-size="15" font-weight="bold" fill="#1f6fb2">1. Token passing</text>
  <text x="140" y="424" font-size="14" fill="#1d2433">Each device ranges with the devices further along and hands the token to its son</text>

  <!-- Step 2: report -->
  <line x1="1040" y1="468" x2="130" y2="468" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1030" y="458" font-size="15" font-weight="bold" fill="#2e8b57" text-anchor="end">2. Data report</text>
  <text x="1030" y="492" font-size="14" fill="#1d2433" text-anchor="end">Each node adds its block (son, grandson, acceleration) and sends the report to its parent</text>

  <!-- Step 3: coordinator -->
  <rect x="40" y="522" width="1120" height="52" rx="10" fill="#fdf1e7" stroke="#e8833a" stroke-width="2"/>
  <text x="60" y="554" font-size="15" font-weight="bold" fill="#1d2433">3. Coordinator</text>
  <text x="200" y="554" font-size="15" fill="#1d2433">Composition (which wagons, in which order) · Integrity (is the train complete?) · TinyML prediction of the train state</text>
</svg>
